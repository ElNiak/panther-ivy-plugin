# Ground truth values for /nct-validate against the QUIC workspace.
# Update these when the protocol model evolves (add/remove files, requirements, etc.).
# The nct-validate command reads this file at runtime; if missing, it falls back to hardcoded values.

version: 1
workspace: quic
last_updated: "2026-03-17"

mcp_tools:
  quic_types_lint_diagnostics: 0
  quic_frame_lint_diagnostics: 0
  quic_connection_include_count: 11
  quic_connection_include_modules:
    - quic_types
    - quic_transport_error_code
    - quic_time
    - quic_application
    - quic_security
    - quic_frame
    - quic_packet
    - quic_packet_retry
    - quic_packet_vn
    - quic_packet_0rtt
    - quic_packet_coal_0rtt
  workspace_total_files: 680
  workspace_total_files_tolerance: 5
  quic_types_verify_error_symbol: "zero_rtt_allowed"
  cid_symbol_file: "quic_types.ivy"
  cid_symbol_line_range: [29, 30]
  quic_packet_type_kind: "object"
  coverage_total: 97
  coverage_must: 42
  coverage_must_not: 12
  coverage_should: 16
  coverage_should_not: 3
  coverage_may: 24
  quality_gate_file_range: [200, 210]

  # Error injection targets (Phase 1 mutation tests)
  mutation_target_file: "quic/quic_stack/quic_types.ivy"
  mutation_target_first_line: "#lang ivy1.7"

lsp:
  quic_types_symbols:
    - cid
    - quic_packet_type
    - role
    - bit
  cid_hover_line: 30
  cid_hover_char: 6

hooks:
  total_event_types: 12
  event_types:
    - PreToolUse
    - PostToolUse
    - PostToolUseFailure
    - SessionStart
    - SessionEnd
    - Stop
    - SubagentStart
    - SubagentStop
    - PreCompact
    - UserPromptSubmit
    - Notification
    - PermissionRequest

  # Maps event types to expected scripts
  expected_scripts:
    PreToolUse:
      - block-direct-ivy.sh
      - lint-before-verify.sh
      - obs_pre_tool_use.py
    PostToolUse:
      - post-write-ivy-lint.sh
      - obs_post_tool_use.py
    PostToolUseFailure:
      - obs_post_tool_use_failure.py
    SessionStart:
      - detect-ivy-workspace.sh
      - obs_session_start.py
    SessionEnd:
      - obs_session_end.py
    Stop:
      - stop-session-summary.sh
      - obs_stop.py
    SubagentStart:
      - obs_subagent_start.py
    SubagentStop:
      - obs_subagent_stop.py
    PreCompact:
      - obs_pre_compact.py
    UserPromptSubmit:
      - obs_user_prompt_submit.py
    Notification:
      - obs_notification.py
    PermissionRequest:
      - obs_permission_request.py

surface:
  command_count: 9
  skill_count: 11
  agent_count: 4
  min_mcp_tools: 18

agents:
  spec-analyst:
    color: blue
    file: agents/spec-analyst.md
  methodology-guide:
    color: cyan
    file: agents/methodology-guide.md
  model-reviewer:
    color: magenta
    file: agents/model-reviewer.md
  traceability-agent:
    color: orange
    file: agents/traceability-agent.md
